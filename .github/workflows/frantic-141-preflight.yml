name: Frantic 141 evidence preflight
on:
  push:
    paths:
      - '.github/workflows/frantic-141-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate published claim packet
        shell: bash
        run: |
          set -euo pipefail
          cat > packet.json <<'EOF'
          {
            "claim_id": "07bdff1f-667a-442a-ab2f-4012e9272790",
            "artifact_refs": [
              "receipt_ref=https://runx.ai/r/fc30a124b072466fbc5ce008b433da8924fab6e20f71fd7f96790673bd87f9cb",
              "report=https://raw.githubusercontent.com/fyodora2/5R/main/evidence/nitrosend-mcp-first-send-2026-10-26.md"
            ],
            "receipt_ref": "https://runx.ai/r/fc30a124b072466fbc5ce008b433da8924fab6e20f71fd7f96790673bd87f9cb"
          }
          EOF
          response_code="$(curl --fail-with-body --silent --show-error --max-time 40 -o preflight.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @packet.json https://gofrantic.com/v1/deliveries/preflight)"
          echo "Frantic preflight HTTP status: $response_code"
          cat preflight.json
          python3 -c 'import json,sys; x=json.load(open("preflight.json",encoding="utf-8")); sys.exit(0 if x.get("ok") is True else 1)'
